[project]
name = "breamfish"
version = "0.1.0"
description = "Fishing conditions and habitat suitability for Bream Bay and Urquharts Bay, New Zealand"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "httpx>=0.28",
]

[project.scripts]
breamfish = "breamfish.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breamfish"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
