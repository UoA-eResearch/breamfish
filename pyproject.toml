[project]
name = "breamfish"
version = "0.1.0"
description = "Fishing conditions and habitat suitability for Bream Bay and Urquharts Bay, New Zealand"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "httpx>=0.28",
]

[project.scripts]
breamfish = "breamfish.cli:main"

[dependency-groups]
dev = [
    "contourpy>=1.4.0",
    "numpy>=2.5.5",
    "pmtiles>=3.8.1",
    "pytest>=8",
    "rasterio>=1.5.2",
    "ruff>=0.8",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breamfish"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/seabed is the hand-run seabed build. It is tested here but never shipped.
pythonpath = ["scripts"]
