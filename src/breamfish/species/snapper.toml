# Snapper: what the habitat index is built from.
#
# Every number the index uses is in this file, beside the published evidence it leans
# on. src/breamfish/habitat.py reads it, scripts/build_habitat.py turns it into the
# grids the site shows, and the site's methods page prints it. Nothing here was fitted
# to catch records: there are none for this bay (docs/data-sources.md).
#
# A factor turns one thing known about a cell of seabed into a suitability from 0 to 1.
# "points" are [value, suitability] pairs, with straight lines between them and the end
# values held beyond them. "basis" says what is published; "judgement" says what was
# decided here because nothing is published. Read both before changing a number.
#
# The sources were read on 26 November 2026. "read" on a reference says how much of it:
# the full text, the abstract only, or a description of it in another source.

key = "snapper"
name = "Snapper"
scientific_name = "Chrysophrys auratus"
applies_to = "Larger snapper, of about 27 cm and over"

# The studies sort snapper at 27 cm, which they give as the minimum legal size at the
# time, and call the larger fish "legal". That is their word for a size class.
# The site does not state size limits (they change; it links to the rules), so the text
# below gives the length and never calls a fish legal.

summary = """
A habitat index, not a catch forecast. It ranks each 100 m square of the bay by how \
well its depth, its bottom and its distance from reef suit snapper in each season, \
going by published studies of north-east New Zealand. It says nothing about how many \
snapper are in the bay, or whether they will bite."""

# How the factors are combined: a weighted geometric mean, so a cell is only as good as
# its factors together and one poor factor cannot be averaged away. A factor with no
# data for a cell (bottom type not mapped) is left out for that cell.
#
# The weights are equal because nothing published says how to rank the factors against
# each other for this bay.

# The index is shown in five classes, cut season by season: each boundary is a fifth of
# the way through that season's rated water. "Highest" is the best fifth of the bay for
# that time of year. The curves give the shape of a season, not how one season compares
# with another, so one season's map is not to be read against another's.
[classes]
method = "fifths"
labels = ["Lowest", "Low", "Middle", "High", "Highest"]

[seasons]
summer = [12, 1, 2]
autumn = [3, 4, 5]
winter = [6, 7, 8]
spring = [9, 10, 11]

# --- Depth, by season -------------------------------------------------------------------

[[factor]]
key = "depth"
label = "Depth"
input = "depth"
unit = "m"
weight = 1.0
confidence = "Moderate in spring and summer, low in autumn and winter"
note = """
Depths in the studies are depths of water; the grid's are below chart datum, about \
1.6 m less at mid tide. The curves are too coarse for that to matter and it is not \
corrected."""
limits = """
No survey has measured snapper by depth in autumn or winter anywhere in this stock \
since one comparison of two depths in 1964 to 1966, and none has done so in Bream Bay \
in any season. The seasonal movement is also different on reef and on open ground: \
trawl catches on soft ground at 20 to 25 m peak in spring, while counts at reef edges \
peak in autumn. One depth curve per season cannot show both."""

[factor.curve.spring]
points = [[0, 0.2], [5, 0.5], [12, 1.0], [25, 1.0], [37, 0.6], [60, 0.3], [100, 0.05], [150, 0.0]]
basis = """
November trawl surveys of the Hauraki Gulf: against the 10 to 25 m strata, snapper \
density in the 25 to 50 m strata was 0.39 (2000) and 0.74 (2020), in 45 to 75 m 0.27 \
to 0.29, and in 75 to 150 m under 0.01. In 1964 to 1966 a station at 20 to 25 m caught \
about 14 times as many adults per hour in spring as stations at 25 to 65 m (read off \
a figure). Spawning \
peaks in November and December, in more than 20 m of water."""
judgement = """
Full suitability from 12 to 25 m; 37 m and 60 m are the middles of the two deeper \
strata. Trawl surveys do not go shallower than 10 m: the 0.5 at 5 m borrows the spring \
count at reef edges, which is 0.4 of the autumn one, and the 0.2 at the surface is a \
guess."""

[factor.curve.summer]
points = [[0, 0.3], [5, 1.0], [25, 1.0], [37, 0.5], [75, 0.2], [100, 0.1], [150, 0.0]]
basis = """
After spawning, snapper disperse, often inshore to feed, and numbers at reef edges \
rise through summer. In a February 2021 trawl survey of the Bay of Plenty, density at \
25 to 50 m was 0.22, and at 50 to 100 m 0.11, of that at 10 to 25 m; in the Hauraki \
Gulf in late November 2020 the 25 to 50 m figure was 0.74. In 1964 to 1966 the \
20 to 25 m station caught 2 to 4.5 times the 25 to 65 m stations in summer."""
judgement = """
Full suitability from 5 to 25 m. The 0.5 at 37 m sits between the two surveys' 0.22 \
and 0.74. Nothing measures adults shallower than 5 m."""

[factor.curve.autumn]
points = [[0, 0.4], [5, 1.0], [20, 1.0], [30, 0.8], [65, 0.8], [100, 0.3], [150, 0.05]]
basis = """
Baited-camera counts of snapper of 27 cm and over at reef edges are highest in \
autumn, 2.55 times the spring count across three places, and more than twice it at the \
Poor Knights, Cape Brett and the Mokohinau Islands. In 1964 to 1966 the 20 to 25 m \
station caught 0.6 to 0.9 times the 25 to 65 m stations in autumn: about level."""
judgement = """
Full suitability from 5 to 20 m for the reef-edge counts, and nearly flat out to 65 m \
for the trawl comparison. There are no autumn figures deeper than 65 m; the tail leans \
on adults being found to about 100 m and on 13% of the East Northland longline catch \
coming from deeper than that."""

[factor.curve.winter]
points = [[0, 0.2], [5, 0.4], [20, 0.9], [30, 1.0], [70, 1.0], [100, 0.6], [150, 0.2], [200, 0.0]]
basis = """
The fishery's own summary says only that the winter grounds are thought to be in \
deeper water, with no depth and no source. In 1964 to 1966 the 20 to 25 m station \
caught 0.6 to 1.9 times the 25 to 65 m stations in winter: about level. Set-netters \
moved to deeper water from May. Snapper on reefs in winter are mostly residents."""
judgement = """
Flat from 30 to 70 m and only a little lower at 20 m. The 0.4 at 5 m borrows the \
spring-to-autumn ratio at reef edges, because no reef survey has been made in winter. \
Beyond 70 m it is a placeholder. This is the least sure of the four curves."""

[[factor.evidence]]
ref = "plenary2024"
says = "Snapper are found to about 200 m and are most abundant in 15 to 60 m. Schools move onto spawning grounds usually in November and December; after spawning the fish disperse, often inshore to feeding grounds. The winter grounds are thought to be in deeper waters (section 2, Biology)."

[[factor.evidence]]
ref = "morrison2002"
says = "Hauraki Gulf trawl survey, 7 to 19 November 2000. From its biomass and stratum-area tables (Tables 1 and 3), snapper density was 3.86 t/km² in the 10 to 25 m strata, 1.52 in 25 to 50 m, 1.11 in the outer gulf (10 to 75 m) and 0.027 in 75 to 150 m. The division is ours."

[[factor.evidence]]
ref = "parsons2022"
says = "Trawl surveys of the Hauraki Gulf (20 November to 1 December 2020) and Bay of Plenty (1 to 14 February 2021). From Tables 1 and 6, snapper density in the gulf was 9.85 t/km² at 10 to 25 m, 7.31 at 25 to 50 m and 2.65 at 45 to 75 m; in the Bay of Plenty 3.64 at 10 to 25 m, 0.80 at 25 to 50 m and 0.40 at 50 to 100 m. The division is ours. The stratum from Bream Bay to Cape Rodney (10 to 50 m) held 50 t, 0.19 t/km², the least of the eleven gulf strata."

[[factor.evidence]]
ref = "paul1976"
says = "Trawl catch per hour at one inshore station (Kawau, 20 to 25 m) and eight offshore stations (25 to 65 m), 1964 to 1966, by season (Fig. 26, p. 44, read off the figure). Adults at the offshore stations showed no clear seasonal change; the inshore station had an influx of 25 to 35 cm fish in spring and early summer (p. 45). Paul's seasons run a month later than the ones used here."

[[factor.evidence]]
ref = "crossland1980"
says = "Egg surveys in 1974 to 1976: spawning was concentrated in the western Hauraki Gulf in more than 20 m; stations close inshore had almost no eggs (p. 15)."

[[factor.evidence]]
ref = "smith2014"
says = "Baited underwater video on sand beside reef at Leigh, Tawharanui and Hahei, 1,045 drops over up to 14 years. Relative density of snapper of 27 cm and over was 0.74 in spring and 1.86 in autumn, a ratio of 2.55 (95% interval 1.35 to 5.15) (Table 5, p. 210)."

[[factor.evidence]]
ref = "denny2004"
says = "Baited video at the Poor Knights, Cape Brett and the Mokohinau Islands, 1998 to 2002, to depths of up to 50 m: snapper were more than twice as common in autumn as in spring at all three."

[[factor.evidence]]
ref = "willis2003"
says = "Inside reserves, snapper of 27 cm and over per drop rose by 3.9 from spring to autumn. Most snapper on reefs in winter are probably residents, and the summer rise is put down to the part of the population that migrates."

[[factor.evidence]]
ref = "langley2016"
says = "East Northland bottom longline, 2007/08 to 2014/15: sets shallower than 100 m took 87% of the snapper catch (p. 9). In the catch-rate model, depth was the last term accepted and added 0.3% to the variation explained (Table A6)."

[[factor.evidence]]
ref = "compton2012"
says = "Night towed video in the inner Hauraki Gulf, 5 to 42 m: depth was left out of the models because it showed no clear association with snapper (p. 222). A caution against making much of depth within that range."

[[factor.evidence]]
ref = "paul1977"
says = "From landings of 1960 to 1971, set-netters moved to deeper water from May (pp. 48 to 49). Paul calls his reading of the seasonal movement tentative."

# --- Bottom type ----------------------------------------------------------------------

[[factor]]
key = "bottom"
label = "Bottom type"
input = "bottom"
weight = 1.0
confidence = "Low: no study compares adults across bottom types by one method at one depth"
limits = """
Adult snapper are found over every kind of bottom, so the scores are kept close \
together. Trawls cannot fish reef and divers do not count over sand, so reef and \
sediment have never been compared like for like. Two studies found that the small \
structure on a soft bottom (shell, sponges, burrows, horse mussels) matters more than \
whether it is sand or mud, and no map of this bay shows that structure. For most of \
the open bay the habitat map says only "soft sediment"."""

[factor.scores]
rock = 1.0
mud = 0.7
soft = 0.6
shell = 0.6
sand = 0.5
coarse = 0.4

[factor.judgements]
rock = "Reef holds resident snapper year round and far more of them where it is not fished. This is for shallow reef: on reef at 40 to 60 m baited cameras saw no more snapper than on mud at 20 to 30 m, and the depth factor has to carry that."
mud = "The most snapper among soft bottoms in 33 years of Hauraki Gulf trawls, adults more so than juveniles; but mud there is also shallow and sheltered."
sand = "Below mud in the trawls, though some sandy stations caught well. In Queensland, sand neither raised nor lowered the odds of seeing snapper."
soft = "Sand or mud, not told apart by the habitat map: the middle of the two."
shell = "Densest on shell hash in one estuary; avoided by juveniles in two other studies. Only 18 cells of the bay are shell."
coarse = "Juveniles were persistently few on coarse ground in two studies. There is nothing on adults."

[[factor.evidence]]
ref = "parsons2014"
says = "Adults occupy sand, mud, rock, biogenic reef, estuaries and open coast, are most abundant shallower than 50 m, and depend less on structure than juveniles do (Adults)."

[[factor.evidence]]
ref = "kendrick2002"
says = "Hauraki Gulf research trawls, 1,381 tows from 1964 to 1997, soft ground only: snapper were most abundant on mud in the inner gulf, with moderate to high catch rates at some sandy stations (p. 708); adults were more strongly tied to mud than juveniles (p. 709)."

[[factor.evidence]]
ref = "shears2006"
says = "Baited video in 2004 on fine sand and mud at 20 to 30 m and on low reef at 40 to 60 m: 24 snapper in 32 drops on the sediment and 35 in 44 on the reef (Table 1, p. 10), no difference in total snapper; the larger fish tended to be on the reef (p. 12)."

[[factor.evidence]]
ref = "willis2003"
says = "Snapper of 27 cm and over were about 14 times denser in three no-take reserves than on fished coast beside them, counted by baited video on sand within 50 m of reef."

[[factor.evidence]]
ref = "usmar2010"
says = "Night video transects in the Mahurangi Harbour, 2005 to 2007: 2.3 snapper per 100 m² on shell hash, 1.5 on sand and 1.48 on horse-mussel beds, fewer on subtidal mud (pp. 65 to 67)."

[[factor.evidence]]
ref = "francis1995"
says = "Kawau Bay trawls, 1987 to 1990, fish up to two years old: catch rates were negligible in every sample on muddy sand with 7 to 22% shell and at times large on sandy mud (pp. 569 to 570)."

[[factor.evidence]]
ref = "thrush2002"
says = "In Kawau Bay the number and variety of small structures on the seabed explained 74% of the variation in juvenile snapper caught (p. 277); a sediment map alone is too coarse (p. 278)."

[[factor.evidence]]
ref = "terres2015"
says = "Moreton Bay, Queensland, baited video 2008 to 2010: the odds of snapper being present were 1.7 times higher with rock and unchanged (0.99) with sand. From another stock; context only."

# --- Distance from reef -----------------------------------------------------------------

[[factor]]
key = "reef"
label = "Distance from reef"
input = "reef_distance"
unit = "m"
weight = 1.0
confidence = "Low: built from how far reef snapper range, not from counts of fish at each distance"
points = [[0, 1.0], [100, 0.9], [300, 0.6], [700, 0.4]]
basis = """
Snapper living on reef keep to small home ranges: about 5.5 hectares on average, at \
most 650 m across, with half their time inside 55 to 200 m, and tagged fish were not \
seen again more than 500 m away. Reef fish moved a median of 0.7 km between tagging \
and recapture. Juveniles gather at the very edge of the reef, and the sediment within \
a few metres of it is grazed down."""
judgement = """
Highest on reef, nearly as high in the cell beside it, falling to 0.6 at 300 m (about \
the width of an average home range) and to 0.4 from 700 m (the widest home range) \
outwards. It does not fall to zero: snapper on open soft bottom are common and keep \
small ranges of their own. Distances are between the centres of 100 m cells, so the \
edge itself, where the effect is strongest, is not resolved."""
limits = """
No study in north-east New Zealand has counted adult snapper at increasing distances \
from reef beyond about 50 m. The home ranges come almost entirely from one no-take \
reserve, where fish may stay put more than on a fished coast, and some reef snapper \
leave for months. Reef here means cells the chart or the habitat map marks as rock; a \
reef they miss is missing here too."""

[[factor.evidence]]
ref = "parsons2003"
says = "Five snapper of 40 to 53 cm tracked by acoustic tags at Goat Island Bay in 2000: home ranges of 2.3 to 14 hectares, mean 5.55, at most 650 m across; half of each fish's time was spent within 55 to 200 m (Table 2, pp. 257 to 261). Four of the five were in the same range 50 weeks later."

[[factor.evidence]]
ref = "willis2001"
says = "Of 117 individually tagged snapper at Goat Island, 49 were seen again, none more than 500 m from where it was tagged; some stayed over three years (p. 585)."

[[factor.evidence]]
ref = "parsons2014"
says = "In the inner Hauraki Gulf, snapper tagged on shallow reef moved a median of 0.7 km, and those on deeper soft sediment 19 km (Adults, citing Parsons et al. 2011)."

[[factor.evidence]]
ref = "ross2007"
says = "Diver counts: 70% of juvenile snapper were on the boundary between reef edge and sand, which was 17% of the habitat surveyed. Read in the paper's abstract and in the account of it in Morrison et al. 2014b (p. 117), which gives the numbers."

[[factor.evidence]]
ref = "langlois2005"
says = "At 24 sites at Leigh, Tawharanui and Hahei, sediment animals 2 and 5 m from the reef differed from those at 15 and 30 m, and bivalves were fewer where snapper and rock lobster were denser. Read in the thesis chapter the paper was published from."

[[factor.evidence]]
ref = "hartill2003"
says = "In an estuary, tagged snapper moved hundreds of metres a day within small areas of soft seabed: snapper away from reef are not just passing through. Abstract only."

[[factor.evidence]]
ref = "egli2004"
says = "Of snapper tracked at Leigh in 2001 and 2002, some stayed all year, some left for good and some came back after up to 83 days away. Abstract only."

